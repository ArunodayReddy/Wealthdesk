# nginx.conf for the WealthDesk web container.
#
# Two jobs: (1) serve the Angular SPA with a client-side-routing fallback,
# (2) proxy /api to the api container so the browser stays same-origin
# (the API deliberately has no CORS middleware — see api/src/main.ts and
# the dev proxy in apps/web/proxy.conf.json; this is the production twin
# of that setup).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths fall through to index.html so the
    # Angular router can resolve /dashboard, /planning, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: browser calls /api/v1/*, nginx forwards to the
    # compose service named "api" (see docker-compose.yml).
    location /api/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
